<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aya-Within – Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <!-- NAVIGATION BAR -->
    <header class="nav">
      <div class="nav-left">
        <a href="#">
          <img src="images/nav-logo-medium.png" alt="Aya-Within logo" class="nav-logo" />
        </a>
      </div>

      <nav class="nav-right">
        <a href="#">Home</a>
        <a href="#offerings">Offerings</a>
        <a href="#about">About</a>
        <a href="#blog">Blog</a>
        <a href="#contact">Contact</a>
      </nav>
      <!-- HAMBURGER + LABEL (mobile) -->
      <div class="hamburger-container">
        <button class="hamburger" aria-label="Open Menu">
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
        <span class="menu-label">Open Menu</span>
      </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero hero-connected" id="home">
      <div class="hero-inner">
        <div class="hero-col-text">
          <!-- Logo -->
          <div class="hero-logo-circle">
            <img src="images/logo-8cs.png" alt="Aya-Within 8Cs Logo" class="hero-logo-8cs" />
          </div>

          <!-- Text + button group -->
          <div class="hero-copy">
            <h1 class="hero-heading">Welcome to All Your Parts</h1>
            <p class="hero-subtitle">
               Patience, Presence, Persistence, Playfulness, Perspective. <br>
               Guiding you to reconnect with Self.
            </p>
            <button class="btn-primary">Book a Session</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Future sections go here -->

  </div>

  <!-- Small script for hamburger behaviour -->
  <script>
    const hamburger = document.querySelector('.hamburger');
    const navRight  = document.querySelector('.nav-right');

    if (hamburger && navRight) {
      hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('open');
        navRight.classList.toggle('open');
      });

      // Close menu when a link is clicked (nice UX)
      navRight.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          hamburger.classList.remove('open');
          navRight.classList.remove('open');
        });
      });
    }
  </script>
</body>
</html>
