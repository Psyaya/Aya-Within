<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aya-Within – Footer Sandbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS (for icons if you want to reuse elsewhere) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons for IG / FB -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />

  <!-- Footer styles -->
  <link rel="stylesheet" href="footer.css" />

  <!-- Playfair for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- Just a spacer so you can see the footer in the sandbox -->
  <main style="min-height: 60vh; background-color: #f4e6d1;"></main>

  <!-- =================== FOOTER =================== -->
  <footer class="site-footer" id="site-footer">
    <div class="footer-main">
      <!-- Left: nav with About dropdown -->
      <nav class="footer-nav">
        <div class="footer-nav-group">
          <button
            type="button"
            class="footer-nav-group-toggle"
            aria-expanded="false"
          >
            <span>About</span>
            <span class="footer-nav-caret">▾</span>
          </button>
          <div class="footer-nav-group-menu">
            <a href="#about-aya">About Aya</a>
            <a href="#testimonials">Testimonials</a>
            <a href="#about-ifs">About IFS</a>
          </div>
        </div>

        <a href="#offerings">Offerings</a>
        <a href="#blog">Blog</a>
        <a href="#contact">Contact</a>
      </nav>

      <!-- Center: logo only (no lotus under it) -->
      <div class="footer-logo-block">
        <img
          src="../images/Nav logo medium.png"
          alt="Aya-Within logo"
          class="footer-nav-logo"
        />
      </div>

      <!-- Right: info + social -->
      <div class="footer-info-block">
        <div class="footer-info-text">
          <p class="footer-name">Aya (Ayelet H) Fogel</p>
          <p class="footer-role">
            IFS-informed coach, meditation &amp; yoga teacher
          </p>
        </div>

        <div class="footer-social">
          <span class="footer-follow-label">Follow me</span>
          <div class="footer-social-icons">
            <a
              href="https://www.instagram.com/aya.within_coaching?igsh=dHhnc2VjbWJvd3cx&utm_source=qr"
              target="_blank"
              rel="noopener noreferrer"
              class="footer-social-link"
            >
              <i class="bi bi-instagram"></i>
              <span class="footer-social-text">Instagram</span>
            </a>

            <a href="#" class="footer-social-link footer-social-fb">
              <i class="bi bi-facebook"></i>
              <span class="footer-social-text">Facebook</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Subscribe strip -->
    <div class="footer-subscribe">
      <div class="footer-subscribe-inner">
        <p class="footer-subscribe-text">
          Subscribe to get notified when new weekly availability opens.
        </p>
        <form class="footer-subscribe-form" action="#" method="post">
          <img
            src="../images/Lotus Square Transparent.png"
            alt="Lotus icon"
            class="footer-subscribe-lotus"
          />
          <input
            type="email"
            name="subscribe-email"
            class="footer-subscribe-input"
            placeholder="e.g., email@example.com"
          />
          <button type="submit" class="footer-subscribe-btn">
            Subscribe
          </button>
        </form>
      </div>
    </div>
  </footer>
  <!-- ================= END FOOTER ================= -->

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"
  ></script>

  <!-- Footer JS: About dropdown, FB + subscribe messages -->
  <script>
    // About dropdown toggle
    const aboutGroup = document.querySelector(".footer-nav-group");
    const aboutToggle = document.querySelector(".footer-nav-group-toggle");

    if (aboutGroup && aboutToggle) {
      aboutToggle.addEventListener("click", function () {
        const isOpen = aboutGroup.classList.toggle("open");
        aboutToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      });
    }

    // Close dropdown if clicking outside
    document.addEventListener("click", function (e) {
      if (
        aboutGroup &&
        !aboutGroup.contains(e.target) &&
        aboutGroup.classList.contains("open")
      ) {
        aboutGroup.classList.remove("open");
        aboutToggle.setAttribute("aria-expanded", "false");
      }
    });

    // Facebook under-construction notice
    const fbLink = document.querySelector(".footer-social-fb");
    if (fbLink) {
      fbLink.addEventListener("click", function (e) {
        e.preventDefault();
        alert("My Facebook page is still under construction. Thank you for your patience 🌱");
      });
    }

    // Subscribe not-working-yet notice (lotus pun)
    const subscribeForm = document.querySelector(".footer-subscribe-form");
    if (subscribeForm) {
      subscribeForm.addEventListener("submit", function (e) {
        e.preventDefault();
        alert(
          "Thank you for your interest 🌸\n\n" +
          "This lotus hasn’t fully opened yet — the subscribe form isn’t live.\n\n" +
          "For now, you’re welcome to email me directly at:\n" +
          "aya.within@gmail.com"
        );
      });
    }
  </script>
</body>
</html>
